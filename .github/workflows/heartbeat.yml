name: Render Heartbeat
on:
  schedule:
    # 每 10 分钟保活 Render 免费服务（防休眠冷启动）
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      service_url:
        description: "Render 服务地址（如 https://mineru-api.onrender.com）"
        required: true
        default: "https://mineru-api.onrender.com"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Ping service
        run: |
          URL="${{ github.event.inputs.service_url || vars.RENDER_SERVICE_URL || 'https://mineru-api.onrender.com' }}"
          echo "ping → ${URL}/health"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${URL}/health" || echo 000)
          echo "health: $code"
          if [ "$code" != "200" ]; then
            echo "⚠️ 服务不可达（可能正在冷启动/休眠，下次心跳自动唤醒）"
            exit 0
          fi
