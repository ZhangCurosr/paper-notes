name: Sync Render Tokens

# ★ 自动同步 mineru_accounts.csv（gpg 加密）→ Render MINERU_TOKENS env
# 本地加 token → 重加密上传（push gpg 即触发）→ 本 workflow 对比 → 变化才更新 → 自动 redeploy
#
# 前提（一次性配置）：
#   1. Render Dashboard → Account Settings → API Keys → Create API Key
#   2. gh secret set RENDER_API_KEY       # Render API key
#   3. gh variable set RENDER_SERVICE_ID  # 可选；不设则按服务名 mineru-api 自动查找
#
# 触发：push 修改 csv.gpg（重加密上传即同步）+ 每日 06:00 UTC 兜底 + 手动

on:
  push:
    paths:
      - "mineru_accounts.csv.gpg"
  workflow_dispatch:        # 手动触发
  schedule:
    - cron: "0 6 * * *"     # 每日 06:00 UTC 巡检（无变化自动跳过，不触发部署）

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt credentials (full CSV)
        env:
          CSV_PASSPHRASE: ${{ secrets.CSV_PASSPHRASE }}
        run: |
          gpg --batch --yes --decrypt --passphrase "$CSV_PASSPHRASE" \
            -o mineru_accounts.csv mineru_accounts.csv.gpg

      - name: Sync tokens to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          MINERU_SERVICE_NAME: ${{ vars.MINERU_SERVICE_NAME || 'mineru-api' }}
        run: python .github/scripts/sync_render_tokens.py
