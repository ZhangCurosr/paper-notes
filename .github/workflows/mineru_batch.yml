name: MinerU Daily Batch

on:
  schedule:
    - cron: '0 2,14 * * *'      # 每天 02:00 / 14:00 UTC（自动）
  workflow_dispatch: {}          # 手动触发

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ── arXiv 论文（按分类矩阵）──
  batch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [cs.CL, cs.AI, cs.LG, cs.CV]
        days: [1]
        max: [250]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Fetch arXiv papers
        run: |
          mkdir -p logs output
          python scripts/arxiv_fetcher.py \
            --category ${{ matrix.category }} \
            --days ${{ matrix.days }} \
            --max ${{ matrix.max }} \
            --out logs/batch_${{ matrix.category }}.json
      - name: Batch parse via token pool
        run: |
          python scripts/mineru_api_pool.py \
            --url-file logs/batch_${{ matrix.category }}_urls.txt \
            --out-dir output/${{ matrix.category }} \
            --rate 40 --submit-workers 8 --download-workers 8
        env:
          MINERU_TOKENS: ${{ secrets.MINERU_TOKENS }}
      - name: Sync results to GitHub (auto new repos)
        run: |
          python scripts/github_sync.py \
            --dir output/${{ matrix.category }} \
            --prefix "mineru-${{ matrix.category }}" \
            --gh-token "${{ secrets.GH_TOKEN }}" \
            --index-repo "mineru-index" \
            --index-out "logs/index_${{ matrix.category }}.json" \
            --max-bytes 500000000
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Upload logs + index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.category }}
          path: logs/
          retention-days: 7

  # ── 学术会议论文（CVPR/ICML/NeurIPS/AAAI/ACL）──
  conference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        venue: [icml2024, cvpr2024, neurips2024, aaai2024, acl2024]
        max: [200]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Fetch conference papers
        run: |
          mkdir -p logs output
          python scripts/conference_fetcher.py \
            --venue ${{ matrix.venue }} \
            --max ${{ matrix.max }} \
            --out logs/conf_${{ matrix.venue }}.json
      - name: Batch parse via token pool
        run: |
          python scripts/mineru_api_pool.py \
            --url-file logs/conf_${{ matrix.venue }}_urls.txt \
            --out-dir output/${{ matrix.venue }} \
            --rate 40 --submit-workers 8 --download-workers 8
        env:
          MINERU_TOKENS: ${{ secrets.MINERU_TOKENS }}
      - name: Sync results to GitHub (auto new repos)
        run: |
          python scripts/github_sync.py \
            --dir output/${{ matrix.venue }} \
            --prefix "mineru-${{ matrix.venue }}" \
            --gh-token "${{ secrets.GH_TOKEN }}" \
            --index-repo "mineru-index" \
            --index-out "logs/index_${{ matrix.venue }}.json" \
            --max-bytes 500000000
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Upload logs + index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.venue }}
          path: logs/
          retention-days: 7

  # ── 总厂库：汇总所有索引 → 导航 + 全量目录 ──
  hub:
    needs: [batch, conference]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all indexes
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Merge indexes and update hub
        run: |
          mkdir -p merged
          find _artifacts -name 'index_*.json' -exec cp {} merged/ \;
          ls merged/ | head
          python scripts/hub_update.py \
            --index-dir merged \
            --hub-repo paper-hub \
            --gh-token "${{ secrets.GH_TOKEN }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
