name: Test MinerU Pool

# ★ CI：每次 push 触及 scripts/tests 时自动跑 59 项测试（单元/并发/安全/server 集成）
# 仓库内无任何凭据需求（测试用 fake token），安全可跑

on:
  push:
    paths:
      - "scripts/*.py"
      - "tests/*.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests

      - name: Run test suite
        run: python tests/test_mineru_pool.py
