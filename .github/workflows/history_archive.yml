name: History Archive

# ★ 每小时把云端服务统计归档到仓库 data/history/<date>.jsonl（GitHub 作为历史数据存储）
# Dashboard「历史」页签通过 GET /v1/history 读取这些文件（服务端从 raw.githubusercontent 拉取聚合）
#
# 依赖：secrets.MINERU_ADMIN_KEY（云端 API 管理员 key，gh secret set MINERU_ADMIN_KEY）

on:
  schedule:
    - cron: "7 * * * *"     # 每小时第 7 分钟
  workflow_dispatch:        # 手动触发

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and append stats
        env:
          MINERU_ADMIN_KEY: ${{ secrets.MINERU_ADMIN_KEY }}
        run: python - <<'EOF'
          import json, os, urllib.request, datetime, time, sys
          key = os.environ["MINERU_ADMIN_KEY"]
          def fetch(path, tries=6):
              last = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request("https://mineru-api-sdwh.onrender.com" + path,
                          headers={"Authorization": "Bearer " + key,
                                   "User-Agent": "python-requests/2.32.3 (mineru-api-client)"})
                      return json.loads(urllib.request.urlopen(req, timeout=60).read())
                  except Exception as e:
                      last = e
                      if i < tries - 1:
                          time.sleep(3)
              raise last
          d = fetch("/v1/stats")["data"]
          tk = d["tokens"]; q = tk["daily"]
          now = datetime.datetime.now(datetime.timezone.utc)
          hour = now.strftime("%m-%d %H")
          row = {"ts": int(now.timestamp()), "hour": hour,
                 "submits": q.get("submits", 0), "pages": q.get("pages", 0),
                 "ok": tk.get("ok", 0), "err": tk.get("err", 0),
                 "tasks_done": d["stats"].get("tasks_total", 0),
                 "err_dist": tk.get("err_dist", {}),
                 "files_left": q.get("files_left")}
          path = f"data/history/{now.strftime('%Y-%m-%d')}.jsonl"
          os.makedirs("data/history", exist_ok=True)
          keep = []
          if os.path.exists(path):
              for line in open(path, encoding="utf-8"):
                  line = line.strip()
                  if line:
                      try:
                          if json.loads(line).get("hour") != hour:
                              keep.append(line)
                      except Exception:
                          pass
          keep.append(json.dumps(row, ensure_ascii=False))
          open(path, "w", encoding="utf-8").write("\n".join(keep) + "\n")
          print(f"history: {path} · {len(keep)} 行（含 {hour} 整点快照）")
          EOF

      - name: Commit and push
        run: |
          git config user.name "history-bot"
          git config user.email "history@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "无变化（数据未变或本小时已归档）"
          else
            git commit -m "chore(history): $(date -u +%F) 归档"
            git push
          fi
